[project]
name = "bgg-data"
version = "0.1.0"
description = "BoardGameGeek data collection and rulebook fetching package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "requests>=2.32.4",
    "requests-html>=0.10.0",
    "PyPDF2>=3.0.0",
    "together>=0.2.0",
    "selenium>=4.15.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "tavily-python>=0.7.0",
    "langgraph>=0.2.35",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-together>=0.1.0",
    "playwright>=1.40.0",
    "replicate>=0.25.0",
    "mlx-vlm>=0.1.0",
    "mlx-lm>=0.20.0",
    "llama-index>=0.11.0",
    "llama-parse>=0.4.0",
    "python-dotenv>=1.0.1",
    "helium>=5.1.1",
    "webdriver-manager>=4.0.2",
    "smolagents>=1.21.3",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.5.5",
    "pymupdf>=1.24.0",
    "streamlit>=1.35.0",
    "streamlit-pdf-viewer>=0.0.14",
    "fastembed>=0.4.0",
    "qdrant-client>=1.9.0",
    "docling>=2.0.0",
    "huggingface_hub>=0.23.0",
    "langdetect>=1.0.9",
    "workflows>=0.1.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

[tool.uv.workspace]
members = [
    "bgg_data/rag/coli_poli_experimentation",
]
