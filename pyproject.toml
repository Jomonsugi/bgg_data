[project]
name = "bgg-data"
version = "0.1.0"
description = "BoardGameGeek data collection and rulebook fetching package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "requests>=2.32.4",
    "requests-html>=0.10.0",
    "PyPDF2>=3.0.0",
    "together>=0.2.0",
    "selenium>=4.15.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "tavily-python>=0.7.0",
    "langgraph>=0.2.35",
    "mlx-vlm>=0.1.0",
    "mlx-lm>=0.20.0",
    "llama-index>=0.11.0",
    "llama-parse>=0.4.0",
    "python-dotenv>=1.0.1",
    "helium>=5.1.1",
    "webdriver-manager>=4.0.2",
    "smolagents>=1.21.3",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.5.5",
    "pymupdf>=1.24.0",
    "huggingface_hub>=0.23.0",
    "langdetect>=1.0.9",
    "workflows>=0.1.0",
]

[project.scripts]
bgg-fetch-rulebooks = "bgg_data.cli.main:main"
bgg-workflow-rulebooks = "bgg_data.llama_index_workflow.cli:main"